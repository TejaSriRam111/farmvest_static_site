name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
      with:
        fetch-depth: 0

    - name: Setup Node.js
      uses: actions/setup-node@v2
      with:
        node-version: 14

    - name: Install and build
      run: |
        if [ -f package.json ]; then
          npm install && npm run build;
        fi
        if [ -d build ]; then
          scp -r build root@your_ssh_address:/var/www/html/;
        elif [ -d dist ]; then
          scp -r dist root@your_ssh_address:/var/www/html/;
        else
          scp . root@your_ssh_address:/var/www/html/;
        fi

    - name: Restart nginx
      run: ssh root@your_ssh_address 'service nginx restart'