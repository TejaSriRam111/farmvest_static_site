name: Azure VM Nginx Deployment

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2

    - name: Setup Node.js
      uses: actions/setup-node@v2
      with:
        node-version: 14

    - name: Install Dependencies and Build
      if: exists(package.json)
      run: |
        npm install
        npm run build

    - name: Copy Build Files
      if: exists(build/) || exists(dist/)
      run: |
        if [ -d build ]; then cp -r build/* /var/www/html/; fi
        if [ -d dist ]; then cp -r dist/* /var/www/html/; fi

    - name: Copy Repository Root (if no build or dist folder)
      if: !exists(build/) && !exists(dist/)
      run: cp -R . /* /var/www/html/

    - name: SSH Config
      uses: ssh-agent/ssh-agent@v4
      with:
        ssh_private_key: ${{ secrets.SSH_PRIVATE_KEY }}

    - name: SCP Files to Azure VM
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.AZURE_VM_HOST }}
        username: ${{ secrets.AZURE_VM_USERNAME }}
        port: 22
        password: ${{ secrets.SSH_PRIVATE_KEY }}
        source: "/var/www/html/*"
        destination: "/var/www/html/"

    - name: Restart Nginx
      run: ssh "${{ secrets.AZURE_VM_USERNAME}}@${{ secrets.AZURE_VM_HOST}}" "sudo service nginx restart"